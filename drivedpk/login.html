<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DrivePK</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">DRIVE<span>PK</span></a>
    <div class="nav-actions">
      <a href="register.html" class="btn-outline">Register</a>
    </div>
  </div>
</nav>

<section class="auth-section">
  <div class="auth-card">
    <div class="auth-logo">DRIVE<span>PK</span></div>
    <div class="auth-tagline">Sign in as a customer, car owner, or admin.</div>

    <div id="alertBox"></div>

    <button type="button" class="login-type-trigger" id="openRoleModal">
      <span>Login Type</span>
      <strong id="selectedRoleText">Customer</strong>
    </button>

    <form id="loginForm" action="php/auth.php" method="POST">
      <input type="hidden" name="action" value="login">
      <input type="hidden" name="login_role" id="loginRole" value="customer">

      <div class="form-group">
        <label id="loginIdLabel">Email Address</label>
        <input type="text" name="login_id" id="loginId" placeholder="your@email.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Password" required>
      </div>

      <button type="submit" class="btn-primary auth-submit">Sign In</button>
    </form>

    <div class="auth-note" id="loginHint">Customers use the email address used during registration.</div>

    <div class="auth-switch">
      Don't have an account? <a href="register.html">Register here</a>
    </div>

    <div style="text-align:center; margin-top:16px;">
      <a href="index.html" style="font-size:13px; color:var(--gray);">Back to Home</a>
    </div>
  </div>
</section>

<div class="modal-backdrop" id="roleModal" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="roleModalTitle">
    <div class="modal-head">
      <div>
        <div class="modal-kicker">Choose Login</div>
        <h2 id="roleModalTitle">Select Account Type</h2>
      </div>
      <button type="button" class="modal-close" id="closeRoleModal" aria-label="Close">x</button>
    </div>

    <div class="modal-role-grid">
      <button type="button" class="role-card active" data-login-role="customer">
        <strong>Customer</strong>
        <span>Book cars and view your rentals.</span>
      </button>
      <button type="button" class="role-card" data-login-role="owner">
        <strong>Car Owner</strong>
        <span>Manage owner access and listings.</span>
      </button>
      <button type="button" class="role-card" data-login-role="admin">
        <strong>Admin</strong>
        <span>Use the separate admin ID.</span>
      </button>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
<script>
(function initLoginPage() {
  const modal = document.getElementById('roleModal');
  const openModal = document.getElementById('openRoleModal');
  const closeModal = document.getElementById('closeRoleModal');
  const roleInput = document.getElementById('loginRole');
  const roleText = document.getElementById('selectedRoleText');
  const loginId = document.getElementById('loginId');
  const loginIdLabel = document.getElementById('loginIdLabel');
  const loginHint = document.getElementById('loginHint');
  const params = new URLSearchParams(window.location.search);

  const roleConfig = {
    customer: {
      label: 'Email Address',
      text: 'Customer',
      placeholder: 'your@email.com',
      hint: 'Customers use the email address used during registration.'
    },
    owner: {
      label: 'Owner Email',
      text: 'Car Owner',
      placeholder: 'owner@email.com',
      hint: 'Car owners use the email address used during owner registration.'
    },
    admin: {
      label: 'Admin ID',
      text: 'Admin',
      placeholder: 'drivepk-admin',
      hint: 'Default admin ID: drivepk-admin | Password: Admin@123'
    }
  };

  function setRole(role) {
    const config = roleConfig[role] || roleConfig.customer;
    roleInput.value = role;
    roleText.textContent = config.text;
    loginIdLabel.textContent = config.label;
    loginId.placeholder = config.placeholder;
    loginHint.textContent = config.hint;

    document.querySelectorAll('[data-login-role]').forEach(button => {
      button.classList.toggle('active', button.dataset.loginRole === role);
    });
  }

  function showModal() {
    modal.hidden = false;
  }

  function hideModal() {
    modal.hidden = true;
  }

  openModal.addEventListener('click', showModal);
  closeModal.addEventListener('click', hideModal);
  modal.addEventListener('click', event => {
    if (event.target === modal) hideModal();
  });

  document.querySelectorAll('[data-login-role]').forEach(button => {
    button.addEventListener('click', () => {
      setRole(button.dataset.loginRole);
      hideModal();
      loginId.focus();
    });
  });

  setRole(['customer', 'owner', 'admin'].includes(params.get('role')) ? params.get('role') : 'customer');

  ['error', 'success'].forEach(type => {
    const message = params.get(type);
    if (message) showAlert('alertBox', message, type);
  });
})();
</script>
</body>
</html>
